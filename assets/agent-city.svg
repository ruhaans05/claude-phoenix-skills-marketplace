<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent City: the Mayor orchestrates from City Hall; the engineer, inspector, herald, courier, and archivist towers do the work; the marshal and the bank ride every phase along the street below. One command in, a passing pull request out.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.6" stop-color="#101027"/>
      <stop offset="1" stop-color="#1d1130"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d3b" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff6a2b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.5" stop-color="#ff9d3b"/>
      <stop offset="1" stop-color="#ff4d1c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset="0.5" stop-color="#ff8c3b"/>
      <stop offset="1" stop-color="#ff5e8a"/>
    </linearGradient>
    <pattern id="winWarm" patternUnits="userSpaceOnUse" width="20" height="26">
      <rect x="5" y="8" width="6" height="10" fill="#ffb86b" opacity="0.20"/>
    </pattern>
    <pattern id="winCool" patternUnits="userSpaceOnUse" width="20" height="26">
      <rect x="5" y="8" width="6" height="10" fill="#7dd9ff" opacity="0.16"/>
    </pattern>
    <pattern id="winLav" patternUnits="userSpaceOnUse" width="20" height="26">
      <rect x="5" y="8" width="6" height="10" fill="#c4a6ff" opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tw  { animation: tw 3.2s ease-in-out infinite; }
      .tw2 { animation: tw 4.1s ease-in-out 1.3s infinite; }
      .tw3 { animation: tw 5.0s ease-in-out 0.6s infinite; }
      @keyframes tw { 0%,100% { opacity:.85 } 50% { opacity:.12 } }
      .pulse { animation: pulse 5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.5 } 50% { opacity:.95 } }
      .flow { stroke-dasharray: 7 11; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -18; } }
    </style>
  </defs>

  <!-- sky -->
  <rect width="1440" height="810" fill="url(#sky)"/>
  <g fill="#cfe2ff">
    <circle cx="150" cy="190" r="1.4" class="tw"/>
    <circle cx="248" cy="120" r="1.1" class="tw2"/>
    <circle cx="345" cy="220" r="1.3" class="tw3"/>
    <circle cx="430" cy="96"  r="1.2" class="tw"/>
    <circle cx="560" cy="150" r="1.2" class="tw2"/>
    <circle cx="705" cy="120" r="1.2" class="tw2"/>
    <circle cx="800" cy="200" r="1.4" class="tw3"/>
    <circle cx="892" cy="130" r="1.1" class="tw"/>
    <circle cx="985" cy="225" r="1.3" class="tw2"/>
    <circle cx="1075" cy="160" r="1.2" class="tw3"/>
    <circle cx="1180" cy="120" r="1.2" class="tw"/>
    <circle cx="1280" cy="210" r="1.3" class="tw2"/>
    <circle cx="1370" cy="150" r="1.1" class="tw3"/>
    <circle cx="528" cy="105" r="1.2" class="tw3"/>
    <circle cx="62"  cy="280" r="1.2" class="tw2"/>
  </g>

  <!-- phoenix sun behind city hall -->
  <circle cx="770" cy="360" r="250" fill="url(#sun)" class="pulse"/>

  <!-- title -->
  <text x="70" y="86" class="sans" font-size="54" font-weight="800" letter-spacing="10" fill="url(#titleGrad)" filter="url(#glow)">AGENT CITY</text>
  <text x="73" y="118" class="sans" font-size="16" letter-spacing="2" fill="#9fb0d0">one command in&#160;&#160;&#8594;&#160;&#160;a passing pull request out</text>
  <text x="1370" y="62" text-anchor="end" class="mono" font-size="13" fill="#6b7a99">/plugin install agent-city@phoenix-city</text>
  <text x="1370" y="84" text-anchor="end" class="mono" font-size="12" fill="#54627f">never merges to main</text>

  <!-- ════════ city-engineer ════════ -->
  <g>
    <rect x="70" y="280" width="190" height="320" fill="#0d1626" fill-opacity="0.93" stroke="#ff8c3b" stroke-width="2" filter="url(#glow)"/>
    <rect x="70" y="280" width="190" height="320" fill="url(#winWarm)"/>
    <rect x="100" y="296" width="6" height="10" fill="#ffd9a0" class="tw"/>
    <rect x="222" y="322" width="6" height="10" fill="#ffd9a0" class="tw2"/>
    <rect x="140" y="470" width="6" height="10" fill="#ffd9a0" class="tw3"/>
    <rect x="90" y="318" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#ff8c3b" stroke-opacity="0.9"/>
    <text x="165" y="337" text-anchor="middle" class="mono" font-size="14" fill="#ffb070">blueprint</text>
    <rect x="90" y="358" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#ff8c3b" stroke-opacity="0.9"/>
    <text x="165" y="377" text-anchor="middle" class="mono" font-size="14" fill="#ffb070">construct</text>
  </g>

  <!-- ════════ city-inspector ════════ -->
  <g>
    <rect x="290" y="340" width="170" height="260" fill="#0d1626" fill-opacity="0.93" stroke="#3bd6ff" stroke-width="2" filter="url(#glow)"/>
    <rect x="290" y="340" width="170" height="260" fill="url(#winCool)"/>
    <rect x="316" y="354" width="6" height="10" fill="#aee9ff" class="tw2"/>
    <rect x="420" y="500" width="6" height="10" fill="#aee9ff" class="tw"/>
    <rect x="300" y="372" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#3bd6ff" stroke-opacity="0.9"/>
    <text x="375" y="391" text-anchor="middle" class="mono" font-size="14" fill="#8fe3ff">test-forge</text>
    <rect x="300" y="412" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#3bd6ff" stroke-opacity="0.9"/>
    <text x="375" y="431" text-anchor="middle" class="mono" font-size="14" fill="#8fe3ff">test-run</text>
  </g>

  <!-- ════════ city-herald ════════ -->
  <g>
    <rect x="480" y="320" width="170" height="280" fill="#0d1626" fill-opacity="0.93" stroke="#b98cff" stroke-width="2" filter="url(#glow)"/>
    <rect x="480" y="320" width="170" height="280" fill="url(#winLav)"/>
    <rect x="506" y="334" width="6" height="10" fill="#dcc6ff" class="tw3"/>
    <rect x="610" y="500" width="6" height="10" fill="#dcc6ff" class="tw"/>
    <rect x="490" y="352" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#b98cff" stroke-opacity="0.9"/>
    <text x="565" y="371" text-anchor="middle" class="mono" font-size="14" fill="#cdb4ff">doc-sync</text>
    <rect x="498" y="396" width="134" height="22" rx="5" fill="#0a1120" fill-opacity="0.7" stroke="#b98cff" stroke-opacity="0.5"/>
    <text x="565" y="411" text-anchor="middle" class="sans" font-size="11" fill="#a890d6">docs ride in the PR</text>
  </g>

  <!-- ════════ city hall (mayor) ════════ -->
  <g>
    <line x1="770" y1="210" x2="770" y2="120" stroke="#ffb347" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M770 86 C756 112 754 124 770 138 C786 124 784 112 770 86 Z" fill="url(#flame)" filter="url(#bigGlow)" class="pulse"/>
    <rect x="700" y="210" width="140" height="30" fill="#0d1626" fill-opacity="0.93" stroke="#ffb347" stroke-width="2" filter="url(#glow)"/>
    <rect x="670" y="240" width="200" height="360" fill="#0d1626" fill-opacity="0.93" stroke="#ffb347" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="670" y="240" width="200" height="360" fill="url(#winWarm)"/>
    <rect x="702" y="258" width="6" height="10" fill="#ffe1ad" class="tw3"/>
    <rect x="822" y="284" width="6" height="10" fill="#ffe1ad" class="tw"/>
    <rect x="742" y="510" width="6" height="10" fill="#ffe1ad" class="tw2"/>
    <text x="770" y="272" text-anchor="middle" class="sans" font-size="13" font-weight="700" letter-spacing="3" fill="#ffd9a0">CITY HALL</text>
    <rect x="690" y="288" width="160" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#ffb347" stroke-opacity="0.9"/>
    <text x="770" y="307" text-anchor="middle" class="mono" font-size="14" fill="#ffcf8a">intake</text>
    <rect x="690" y="328" width="160" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#ffb347" stroke-opacity="0.9"/>
    <text x="770" y="347" text-anchor="middle" class="mono" font-size="14" fill="#ffcf8a">city-charter</text>
  </g>

  <!-- ════════ city-courier ════════ -->
  <g>
    <rect x="900" y="320" width="170" height="280" fill="#0d1626" fill-opacity="0.93" stroke="#ff5e8a" stroke-width="2" filter="url(#glow)"/>
    <rect x="900" y="320" width="170" height="280" fill="url(#winWarm)"/>
    <rect x="926" y="336" width="6" height="10" fill="#ffc1d4" class="tw"/>
    <rect x="1030" y="502" width="6" height="10" fill="#ffc1d4" class="tw3"/>
    <rect x="910" y="358" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#ff5e8a" stroke-opacity="0.9"/>
    <text x="985" y="377" text-anchor="middle" class="mono" font-size="14" fill="#ff9eb8">pr-open</text>
    <rect x="910" y="398" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#ff5e8a" stroke-opacity="0.9"/>
    <text x="985" y="417" text-anchor="middle" class="mono" font-size="14" fill="#ff9eb8">pr-steward</text>
  </g>

  <!-- ════════ city-archivist (database cylinder) ════════ -->
  <g>
    <rect x="1110" y="392" width="180" height="208" fill="#0d1626" fill-opacity="0.93" stroke="#7df0c0" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="1200" cy="392" rx="90" ry="17" fill="#0d1626" stroke="#7df0c0" stroke-width="2" filter="url(#glow)"/>
    <path d="M1110 545 A90 17 0 0 0 1290 545" fill="none" stroke="#7df0c0" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="1125" y="424" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#7df0c0" stroke-opacity="0.9"/>
    <text x="1200" y="443" text-anchor="middle" class="mono" font-size="14" fill="#a9f5d4">db-consult</text>
    <rect x="1125" y="464" width="150" height="28" rx="6" fill="#0a1120" fill-opacity="0.85" stroke="#7df0c0" stroke-opacity="0.9"/>
    <text x="1200" y="483" text-anchor="middle" class="mono" font-size="14" fill="#a9f5d4">db-provision</text>
  </g>

  <!-- pipeline flowing through the city -->
  <line x1="70" y1="585" x2="1290" y2="585" stroke="#ff8c3b" stroke-width="2" stroke-opacity="0.55" class="flow" filter="url(#glow)"/>

  <!-- ground -->
  <rect x="0" y="600" width="1440" height="210" fill="#060d18"/>
  <line x1="0" y1="600" x2="1440" y2="600" stroke="#23496b" stroke-width="1.5"/>

  <!-- tower nameplates -->
  <g text-anchor="middle">
    <text x="165" y="626" class="mono" font-size="15" font-weight="700" fill="#ff8c3b">city-engineer</text>
    <text x="165" y="644" class="sans" font-size="11" fill="#6b7a99">writes your code</text>
    <text x="375" y="626" class="mono" font-size="15" font-weight="700" fill="#3bd6ff">city-inspector</text>
    <text x="375" y="644" class="sans" font-size="11" fill="#6b7a99">writes + runs the tests</text>
    <text x="565" y="626" class="mono" font-size="15" font-weight="700" fill="#b98cff">city-herald</text>
    <text x="565" y="644" class="sans" font-size="11" fill="#6b7a99">keeps the docs in sync</text>
    <text x="770" y="626" class="mono" font-size="15" font-weight="700" fill="#ffb347">mayor</text>
    <text x="770" y="644" class="sans" font-size="11" fill="#6b7a99">orchestrates the pipeline</text>
    <text x="985" y="626" class="mono" font-size="15" font-weight="700" fill="#ff5e8a">city-courier</text>
    <text x="985" y="644" class="sans" font-size="11" fill="#6b7a99">opens + stewards the PR</text>
    <text x="1200" y="626" class="mono" font-size="15" font-weight="700" fill="#7df0c0">city-archivist</text>
    <text x="1200" y="644" class="sans" font-size="11" fill="#6b7a99">database, when needed</text>
  </g>

  <!-- ════════ the street patrol: rides every phase ════════ -->
  <text x="720" y="682" text-anchor="middle" class="sans" font-size="12" letter-spacing="3" fill="#5a6b88">— RIDE EVERY PHASE, READ-ONLY —</text>

  <!-- city-marshal -->
  <g>
    <rect x="150" y="694" width="520" height="74" rx="10" fill="#140d12" fill-opacity="0.9" stroke="#ff6a4d" stroke-width="1.6" filter="url(#glow)"/>
    <path d="M186 706 L214 706 L214 726 C214 738 200 744 200 744 C200 744 186 738 186 726 Z" fill="#1a0f10" stroke="#ff6a4d" stroke-width="1.6"/>
    <path d="M193 722 l5 6 l9 -11" fill="none" stroke="#ff9d7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="234" y="718" class="mono" font-size="15" font-weight="700" fill="#ff8a6a">city-marshal</text>
    <text x="234" y="736" class="sans" font-size="11" fill="#8a6f72">the police · patrol · halt authority</text>
    <g class="mono" font-size="10.5" fill="#ffb7a3" text-anchor="middle">
      <rect x="234" y="744" width="86" height="18" rx="9" fill="#241013" stroke="#ff6a4d" stroke-opacity="0.55"/>
      <text x="277" y="757">ethics</text>
      <rect x="326" y="744" width="96" height="18" rx="9" fill="#241013" stroke="#ff6a4d" stroke-opacity="0.55"/>
      <text x="374" y="757">licenses</text>
      <rect x="428" y="744" width="108" height="18" rx="9" fill="#241013" stroke="#ff6a4d" stroke-opacity="0.55"/>
      <text x="482" y="757">secrets/PII</text>
      <rect x="542" y="744" width="110" height="18" rx="9" fill="#241013" stroke="#ff6a4d" stroke-opacity="0.55"/>
      <text x="597" y="757">data quality</text>
    </g>
  </g>

  <!-- city-bank -->
  <g>
    <rect x="770" y="694" width="520" height="74" rx="10" fill="#0f1410" fill-opacity="0.9" stroke="#ffd24a" stroke-width="1.6" filter="url(#glow)"/>
    <circle cx="806" cy="722" r="16" fill="#15170d" stroke="#ffd24a" stroke-width="1.6"/>
    <text x="806" y="727" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="#ffe27a">$</text>
    <text x="834" y="718" class="mono" font-size="15" font-weight="700" fill="#ffd24a">city-bank</text>
    <text x="834" y="736" class="sans" font-size="11" fill="#8a8560">the treasury · budget · advisory only</text>
    <g class="mono" font-size="10.5" fill="#f0e29a" text-anchor="middle">
      <rect x="834" y="744" width="150" height="18" rx="9" fill="#171a0d" stroke="#ffd24a" stroke-opacity="0.5"/>
      <text x="909" y="757">logs token cost</text>
      <rect x="990" y="744" width="170" height="18" rx="9" fill="#171a0d" stroke="#ffd24a" stroke-opacity="0.5"/>
      <text x="1075" y="757">never halts the work</text>
    </g>
  </g>

  <!-- pipeline strip -->
  <text x="720" y="796" text-anchor="middle" class="mono" font-size="12" fill="#54627f">intake &#8594; blueprint &#8594; construct &#8594; test-forge &#8594; test-run &#8594; doc-sync &#8594; pr-open &#8594; pr-steward &#8594; green &#10003;</text>
</svg>
